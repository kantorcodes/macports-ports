name: Debug HOL Guard mpbb fetch

on:
  workflow_dispatch:
  push:
    branches:
      - hol-guard-desktop-port-ci-validate

permissions:
  contents: read

jobs:
  debug-fetch:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ports
        uses: actions/checkout@v6
        with:
          fetch-depth: 64
          path: ports
          show-progress: false
      - name: Checkout mpbb
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: macports/mpbb
          path: mpbb
          show-progress: false
      - name: Set checkout permissions
        run: |
          chmod -R a+rX ./ports
          CUR_DIR="$(dirname "$(realpath ./ports)")"
          while [ -n "$CUR_DIR" ] && [ "$CUR_DIR" != "/" ]; do
            sudo chmod a+rx "$CUR_DIR"
            CUR_DIR="$(dirname "$CUR_DIR")"
          done
      - name: Bootstrap MacPorts
        run: . ports/.github/workflows/bootstrap.sh mpbb
      - name: Capture fetch diagnostics
        shell: bash
        run: |
          set -uo pipefail
          echo "uname=$(uname -m)" | tee fetch-debug.txt
          sw_vers | tee -a fetch-debug.txt
          /opt/local/bin/port version | tee -a fetch-debug.txt
          cd ports/security/hol-guard
          set +e
          sudo /opt/local/bin/port -d fetch 2>&1 | tee -a "$GITHUB_WORKSPACE/fetch-debug.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "fetch_rc=$rc" | tee -a "$GITHUB_WORKSPACE/fetch-debug.txt"
          exit 0
      - name: Upload fetch diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: hol-guard-fetch-${{ matrix.os }}
          path: fetch-debug.txt
