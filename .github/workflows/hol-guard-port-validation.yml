name: Validate HOL Guard Portfile

on:
  workflow_dispatch:
  push:
    branches:
      - hol-guard-desktop-port-ci-validate

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install MacPorts
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL -o /tmp/MacPorts.pkg https://github.com/macports/macports-base/releases/download/v2.12.6/MacPorts-2.12.6-15-Sequoia.pkg
          sudo installer -pkg /tmp/MacPorts.pkg -target /
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"
      - name: Validate Portfile
        shell: bash
        run: |
          set -euxo pipefail
          sudo mkdir -p /tmp/hol-guard-localports/security
          sudo cp -R "$GITHUB_WORKSPACE/security/hol-guard" /tmp/hol-guard-localports/security/
          sudo chmod -R a+rX /tmp/hol-guard-localports
          cd /tmp/hol-guard-localports/security/hol-guard
          sudo /opt/local/bin/port -v lint
          sudo /opt/local/bin/port -N -v fetch
          sudo /opt/local/bin/port -N -v destroot
          test -d /opt/local/var/macports/build/*/*/hol-guard/work/destroot/Applications/MacPorts/HOL\ Guard.app || find /opt/local/var/macports/build -maxdepth 8 -name 'HOL Guard.app' -print -quit | grep -q .
